# PR preview: publishes sitio/ of the PR under pr-preview/pr-N/ in gh-pages and comments the link. Removed when the PR closes.
name: Vista previa
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  vista-previa:
    name: Vista previa del PR en GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Publicar o retirar la vista previa
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.action }}" = "closed" ]; then
            sh herramientas/publicar-pages.sh "pr-preview/pr-${{ github.event.pull_request.number }}" remove
          else
            sh herramientas/publicar-pages.sh "pr-preview/pr-${{ github.event.pull_request.number }}"
          fi
      - name: Comentar el link en el PR
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/pr-preview/pr-${context.issue.number}/`;
            const marca = '<!-- vista-previa -->';
            const body = `${marca}\n**Vista previa de este PR:** ${url}\n\nSe actualiza con cada push y se retira al cerrar el PR. Puede tardar un minuto en reflejar el último cambio.`;
            const { data: comentarios } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const previo = comentarios.find((c) => c.body && c.body.startsWith(marca));
            if (previo) await github.rest.issues.updateComment({ ...context.repo, comment_id: previo.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
  desplegar:
    # Publishes the gh-pages branch as the GitHub Pages site (production root plus PR previews) with the repo's own token.
    name: Desplegar gh-pages en GitHub Pages
    needs: vista-previa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Activar GitHub Pages si hace falta
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
