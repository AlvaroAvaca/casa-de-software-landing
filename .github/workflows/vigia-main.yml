# Watchman for main: every push to main must come from a pull request merged by the repository owner.
# GitHub Free cannot block pushes on private repos, so this alerts and fails visibly instead.
name: Vigía de main
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  vigia:
    name: Vigía (¿vino de un PR aprobado por el dueño?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            const merged = prs.find((p) => p.merged_at && p.merge_commit_sha === sha);
            let reason = '';
            if (!merged) {
              reason = `el commit ${sha.slice(0, 7)} no viene de un PR fusionado (push directo por ${context.actor})`;
            } else {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: merged.number });
              const by = pr.merged_by && pr.merged_by.login;
              if (by !== owner) reason = `el PR #${merged.number} fue fusionado por ${by}, no por ${owner}`;
            }
            if (!reason) {
              core.info(`OK: ${sha.slice(0, 7)} viene del PR #${merged.number} fusionado por ${owner}.`);
              return;
            }
            const title = `PUSH NO AUTORIZADO a main: ${sha.slice(0, 7)}`;
            const body = [
              'El vigía detectó un cambio en main que no pasó por el camino de la Casa.',
              '',
              `- Motivo: ${reason}`,
              `- Commit: ${sha}`,
              `- Actor: ${context.actor}`,
              '',
              'Qué hacer: revertir con un PR y revisar los permisos de la app o cuenta que empujó.',
            ].join('\n');
            await github.rest.issues.create({ owner, repo, title, body, labels: ['error'] });
            core.setFailed(reason);
