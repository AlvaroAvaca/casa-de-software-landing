<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sitio nuevo de la Casa de software</title>
  <style>
    :root {
      color-scheme: light dark;
      --color-fondo: #ffffff;
      --color-texto: #1a1a1a;
      --color-borde: #d0d0d0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-fondo: #121212;
        --color-texto: #f0f0f0;
        --color-borde: #3a3a3a;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--color-fondo);
      color: var(--color-texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2rem 16px;
    }

    h1 {
      font-size: 1.75rem;
    }

    section#estado-real {
      margin-top: 2rem;
      padding: 1rem;
      border: 1px solid var(--color-borde);
      border-radius: 0.5rem;
    }

    h2 {
      margin-top: 0;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sitio nuevo de la Casa de software</h1>
    <p>Esta página es un marcador de posición que el proyecto reemplazará con contenido real.</p>

    <section id="estado-real" aria-labelledby="estado-real-titulo">
      <h2 id="estado-real-titulo">Estado real</h2>
      <p>Todavía no hay nada publicado.</p>
    </section>
  </main>
</body>
</html>
